# Dev-контур для отладки. Prod остаётся нетронутым.
#
# Запуск:   docker compose -f docker-compose.dev.yml up -d
# Остановка: docker compose -f docker-compose.dev.yml down
# Пересборка: docker compose -f docker-compose.dev.yml build backend-dev

services:
  backend-dev:
    build: ./backend
    image: 1c-ai-agent-backend:dev
    restart: unless-stopped
    env_file: .env.dev
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres-dev:5432/${POSTGRES_DB:-agentdb}
      ONEC_MCP_URL: ${ONEC_MCP_URL_COMPOSE:-http://mcp-proxy-dev:8000}
    ports:
      - "${BACKEND_DEV_PORT:-8001}:8000"
    volumes:
      - ./backend/agents:/app/agents:ro
      - ./backend/skills:/app/skills:ro
      - ./backend/patterns:/app/patterns:ro
      - ./backend/bases.conf:/app/bases.conf:ro
      - ./backend/creds.conf:/app/creds.conf:ro
    depends_on:
      postgres-dev:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir src"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-dev:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb_dev}
    ports:
      - "${POSTGRES_DEV_PORT:-5434}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dev-data:
